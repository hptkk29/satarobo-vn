<style>
:root{
  --p:#6B21A8;--p2:#7C3AED;--p3:#A855F7;--p4:#C084FC;--pdark:#3B0764;
  --orange:#F97316;--gold:#F59E0B;--gold2:#FCD34D;--green:#10B981;--red:#EF4444;
  --white:#FFFFFF;--ink:#1F2937;
  --fh:'Lexend Deca',sans-serif;--fb:'Be Vietnam Pro',sans-serif;
  --sh:0 16px 54px rgba(107,33,168,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--fb);color:var(--ink);line-height:1.4;
  background:linear-gradient(165deg,#F6F1FF 0%,#EBE2FF 50%,#F9F5FF 100%);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-deco::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(168,85,247,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.045) 1px,transparent 1px);
  background-size:48px 48px}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4}
.blob1{width:400px;height:400px;background:#C084FC;top:-150px;right:-100px}
.blob2{width:360px;height:360px;background:#F9731677;bottom:-130px;left:-100px}

.card{position:relative;z-index:1;width:100%;max-width:1160px;background:#fff;border-radius:26px;
  box-shadow:var(--sh);border:1px solid rgba(168,85,247,.14);overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;z-index:2;
  background:linear-gradient(90deg,var(--p),var(--orange),var(--gold2))}

/* HEADER: logo/tiêu đề trái + ô Mã NV phải */
.head{display:flex;align-items:center;gap:24px;padding:20px 34px;border-bottom:1px solid #F0E8FA}
.head-l{display:flex;align-items:center;gap:16px;flex-shrink:0}
.head-l img{height:56px;width:auto}
.head-l .t h1{font-family:var(--fh);font-size:24px;color:var(--pdark);font-weight:900;line-height:1.05}
.head-l .t h1 span{color:var(--orange)}
.head-l .t p{font-size:13px;color:#8B7BA3;margin-top:2px}

.staff-inline{flex:1;min-width:280px;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#FFF4E6,#FEEAD3);border:2px solid var(--orange);
  border-radius:14px;padding:11px 16px}
.staff-inline .si-lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.staff-inline .si-lab b{font-size:14px;color:#9A3412;font-weight:800}
.staff-inline .si-lab b .star{color:var(--red)}
.staff-inline .si-lab .eg{font-size:11.5px;color:#B4703A;font-style:italic}
.staff-inline .si-lab code{background:#fff;color:#B45309;padding:2px 7px;border-radius:5px;
  font-family:'Lexend Deca',monospace;font-weight:700;font-size:11.5px;border:1px dashed #E0A060}
.staff-inline input{width:100%!important;padding:12px 15px!important;border:2px solid #F9C99A!important;
  border-radius:10px!important;font-family:'Lexend Deca',var(--fb)!important;font-size:16px!important;font-weight:700!important;
  letter-spacing:.5px!important;background:#fff!important;color:#9A3412!important;transition:all .16s!important;
  -webkit-appearance:none;appearance:none;text-transform:uppercase}
.staff-inline input::placeholder{color:#D9A574!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;font-size:14px!important}
.staff-inline input:focus{outline:none!important;border-color:var(--orange)!important;box-shadow:0 0 0 4px rgba(249,115,22,.16)!important}

.body{padding:18px 34px 26px}

.rally{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border-radius:13px;padding:12px 18px;margin-bottom:18px}
.rally .ic{font-size:20px;flex-shrink:0}
.rally p{font-size:14px;line-height:1.4;margin:0}
.rally strong{color:var(--gold2)}

#misa-embed table,#misa-embed tbody{display:block}
#misa-embed tbody{display:grid!important;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px 20px}
#misa-embed tr{display:contents}
#misa-embed td{padding:0!important;border:none!important;display:block}
#misa-embed .fld{display:flex;flex-direction:column}
#misa-embed .fld.span2{grid-column:span 2}
#misa-embed .fld.span4{grid-column:1 / -1}
#misa-embed label{font-size:13.5px!important;font-weight:600!important;color:var(--ink)!important;
  margin-bottom:6px;font-family:var(--fb)!important;display:flex;align-items:center;gap:6px;white-space:nowrap}
#misa-embed label .req{color:var(--red);font-weight:700}
#misa-embed label .key{font-size:10.5px;color:var(--orange);font-weight:700;background:#FFF1E6;padding:2px 7px;border-radius:20px}
#misa-embed input[type=text],#misa-embed input[type=email],#misa-embed select{
  width:100%!important;padding:13px 15px!important;border:1.6px solid #E4D8F1!important;border-radius:11px!important;
  font-family:var(--fb)!important;font-size:15.5px!important;background:#FDFBFF!important;color:var(--ink)!important;
  transition:all .16s!important;-webkit-appearance:none;appearance:none}
#misa-embed select{background:#FDFBFF url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236B21A8' stroke-width='3'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 13px center!important;padding-right:38px!important}
#misa-embed input:focus,#misa-embed select:focus{outline:none!important;border-color:var(--p3)!important;background:#fff!important;box-shadow:0 0 0 4px rgba(168,85,247,.13)!important}
#misa-embed input::placeholder{color:#BBABCF!important}
#misa-embed .fld.key input,#misa-embed .fld.key select{border-color:#D6BEEF!important;background:#FBF7FF!important}
#misa-embed .actions{grid-column:1 / -1;display:flex;gap:14px;margin-top:6px}
#misa-embed input[type=submit]{flex:1;background:linear-gradient(135deg,var(--orange),#EA580C)!important;color:#fff!important;
  font-family:var(--fh)!important;font-weight:700!important;font-size:18px!important;letter-spacing:.4px!important;
  padding:17px 24px!important;border:none!important;border-radius:13px!important;cursor:pointer!important;
  box-shadow:0 10px 28px rgba(249,115,22,.4)!important;transition:transform .16s,box-shadow .16s!important}
#misa-embed input[type=submit]:hover{transform:translateY(-2px)!important;box-shadow:0 14px 36px rgba(249,115,22,.55)!important}
#misa-embed input[type=reset]{background:#F3EEF9!important;color:#8B7BA3!important;font-family:var(--fb)!important;
  font-weight:600!important;font-size:15px!important;padding:17px 26px!important;border:none!important;
  border-radius:13px!important;cursor:pointer!important;flex-shrink:0;transition:background .16s!important}
#misa-embed input[type=reset]:hover{background:#E9E0F5!important}

.foot{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:#9585AD;text-align:center}
.foot svg{flex-shrink:0}

/* ===== TABLET ===== */
@media(max-width:1000px){
  .card{max-width:820px}
  #misa-embed tbody{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:760px){
  #misa-embed tbody{grid-template-columns:1fr 1fr}
  #misa-embed .fld.span2{grid-column:1 / -1}
}

/* ===== ĐIỆN THOẠI: fit chiều ngang, cho cuộn dọc, header xếp DỌC ===== */
@media(max-width:600px){
  html,body{height:auto}
  body{display:block;min-height:100dvh;padding:12px}
  .card{max-width:100%;border-radius:18px;margin:0 auto}
  /* HEADER xếp dọc: logo+tiêu đề trên, ô Mã NV riêng dòng dưới -> không dồn ngang */
  .head{flex-direction:column;align-items:stretch;gap:12px;padding:16px 16px 14px}
  .head-l{justify-content:center;gap:12px}
  .head-l img{height:44px}
  .head-l .t{text-align:center}
  .head-l .t h1{font-size:19px}
  .head-l .t p{font-size:12px}
  .staff-inline{min-width:0;width:100%;padding:11px 13px}
  .staff-inline .si-lab{gap:6px}
  .staff-inline .si-lab b{font-size:13px}
  .staff-inline .si-lab .eg{font-size:10.5px}
  .staff-inline .si-lab code{font-size:10.5px}
  .staff-inline input{font-size:15px!important;padding:11px 13px!important}
  .body{padding:14px 16px 20px}
  .rally{padding:10px 13px;margin-bottom:14px}.rally p{font-size:12.5px}.rally .ic{font-size:17px}
  #misa-embed tbody{grid-template-columns:1fr 1fr;gap:12px 12px}
  #misa-embed .fld.span2,#misa-embed .fld.span4{grid-column:1 / -1}
  #misa-embed label{font-size:12px;white-space:normal}
  #misa-embed input,#misa-embed select{font-size:15px!important;padding:12px 13px!important}
  #misa-embed .actions{margin-top:4px}
  #misa-embed input[type=submit]{font-size:16px!important;padding:15px 20px!important}
  #misa-embed input[type=reset]{padding:15px 20px!important}
}
/* điện thoại nhỏ: 1 cột cho dễ nhập */
@media(max-width:420px){
  .head-l{flex-direction:column;text-align:center}
  #misa-embed tbody{grid-template-columns:1fr}
  #misa-embed .fld.span2{grid-column:auto}
  #misa-embed .actions{flex-direction:column-reverse}
}
</style>

      cell.appendChild(box);
    }
    box.textContent = message;
    input.style.borderColor = '#b91c1c';
    input.focus();
  }

  function clearError(input) {
    var cell = input.closest('td') || input.parentNode;
    var box = cell.querySelector('.sr-err');
    if (box) box.remove();
    input.style.borderColor = '';
  }

  // Pha CAPTURE trên document ⇒ chạy TRƯỚC onsubmit inline của mã MISA, nên
  // chặn được trước khi nút Gửi bị disable.
  document.addEventListener('submit', function (e) {
    var f = form();
    if (!f || e.target !== f) return;
    var phone = f['CustomField15'];
    if (!phone) return;
    var digits = String(phone.value || '').replace(/[^0-9]/g, '');
    if (digits.length === 0) {
      e.preventDefault();
      e.stopPropagation();
      showError(phone, 'Vui lòng nhập số điện thoại phụ huynh.');
      return;
    }
    if (digits.length < 9) {
      e.preventDefault();
      e.stopPropagation();
      showError(phone, 'Số điện thoại chưa đủ chữ số — kiểm tra lại giúp nhé.');
      return;
    }
    clearError(phone);

    // Cơ sở: select nay có option trống đứng đầu (trước đây không có, nên phiếu
    // nào không đụng tới ô này cũng âm thầm gửi CS1 — sai cơ sở là lead giao
    // nhầm nơi). Bắt chọn tường minh.
    var center = f['CustomField17'];
    if (center && !String(center.value || '').trim()) {
      e.preventDefault();
      e.stopPropagation();
      showError(center, 'Vui lòng chọn cơ sở học.');
      return;
    }
    if (center) clearError(center);
  }, true);

  // Quay lại từ trang lỗi/cảm ơn (bfcache) → nút Gửi phải sống lại.
  window.addEventListener('pageshow', function () {
    var btn = document.getElementById('formsubmit');
    if (btn) btn.disabled = false;
  });
})();
</script>
</body>
</html>
