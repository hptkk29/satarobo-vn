name: Seed Production RolePermission (Supabase)

# =============================================================================
# Chạy TAY (workflow_dispatch) — seed RoleDef + RolePermission (RBAC v2) lên PROD.
#
# deploy.yml chỉ `migrate deploy` (SCHEMA). Workflow này seed DATA quyền v2
# (prisma/seed-roles.ts): upsert RoleDef theo code + reset RolePermission mỗi lần
# chạy → idempotent, chạy lại an toàn.
#
# ⚠️ ĐÍNH CHÍNH 29/07/2026 — câu cũ dưới đây ĐÃ HẾT HẠN, đừng tin bản trước:
#   ~~"Runtime hiện chạy v1 matrix (RBAC_V2 OFF) nên seed này KHÔNG đổi hành vi
#     cho tới khi flip — chỉ để prod v2 sẵn sàng."~~
# `RBAC_V2_ENABLED="true"` trên Vercel **Production** (xác minh 29/07/2026) ⇒ prod
# enforce v2 ⇒ **seed này ĐỔI HÀNH VI QUYỀN NGAY** khi chạy. Không còn là bước
# "chuẩn bị sẵn" nữa.
#
# KHI NÀO CHẠY: mỗi khi `ROLE_SEED` trong prisma/seed-roles.ts đổi. Vì nó đổi hành vi
# thật, hãy báo trước cho người trực và tránh giờ cao điểm.
#
# AN TOÀN: `seedRoles()` chạy toàn bộ trong MỘT `$transaction` (vá 29/07, xem KB-06 ở
# docs/taicautruc/05-premortem.md) ⇒ không còn khoảng nào `RolePermission` rỗng. TRƯỚC
# bản vá đó, chạy workflow này khi cờ v2 đang bật = mất quyền toàn hệ thống trong lúc seed.
#
# SAU KHI CHẠY: seed reset toàn bộ RolePermission ⇒ mapping v1↔v2 đổi ⇒ cân nhắc
# TRUNCATE lại đồng hồ shadow, vì nền so sánh cũ không còn nghĩa.
#
# ⚠️ Ghi đè RolePermission bằng ĐỊNH NGHĨA TRONG CODE (seed-roles.ts). Nếu prod có
# chỉnh role runtime qua UI mà KHÔNG đưa vào seed-roles.ts, chỉnh đó sẽ bị reset.
#
# SECRETS (đã khai cho deploy.yml): PROD_DATABASE_URL / PROD_DIRECT_URL.
# Dùng PROD_DIRECT_URL (session pooler :5432) cho client seed để tránh quirk
# prepared-statement của transaction pooler.
# =============================================================================

on:
  workflow_dispatch: {}

concurrency:
  group: seed-production-roles
  cancel-in-progress: false

jobs:
  seed-roles:
    name: Seed RoleDef + RolePermission (Supabase prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kiểm tra secrets prod (fail sớm)
        run: |
          missing=0
          [ -n "${{ secrets.PROD_DATABASE_URL }}" ] || { echo "::error::Thiếu secret PROD_DATABASE_URL"; missing=1; }
          [ -n "${{ secrets.PROD_DIRECT_URL }}" ]   || { echo "::error::Thiếu secret PROD_DIRECT_URL"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Seed RolePermission (prod) — kỳ vọng "✅ Seeded 14 RoleDef"
        run: pnpm exec tsx prisma/seed-roles.ts
        env:
          # client seed dùng session pooler (:5432) để tránh prepared-statement quirk
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
