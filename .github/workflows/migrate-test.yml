name: Migrate TEST DB (Supabase dev)

# =============================================================================
# Cổng tiền-prod (chốt 01/08/2026). Nhánh `test` là bản ĐANG NGHIỆM THU:
#
#   feature → PR → merge `test` → test.satarobo.vn tự cập nhật → UAT
#                                → PR `test` → `main` → PROD đổi
#
# Deploy code do VERCEL lo (environment `test` bám nhánh `test`). Workflow này
# chỉ chạy `prisma migrate deploy` TRƯỚC, để bản Vercel build ra không gọi
# field/table chưa tồn tại — y hệt vai trò của deploy.yml với prod.
#
# ── SECRETS cần khai (GitHub → Settings → Secrets and variables → Actions):
#     TEST_DATABASE_URL   → transaction pooler :6543 (runtime)
#     TEST_DIRECT_URL     → session pooler     :5432 (migrate)
#
# ⚠️ Lấy đúng 2 giá trị mà **Vercel environment `test`** đang dùng (Settings →
# Environment Variables → scope `test`), đừng đoán. Đo bằng Vercel CLI 31/07:
# env `test` có `DATABASE_URL` RIÊNG — khác DB dev (Development+Preview dùng
# chung) và khác prod. Nếu hoá ra nó trỏ DB dev thì phải biết thêm: migration
# DROP/RENAME sẽ đụng luôn dữ liệu đang làm việc ở máy local.
# Muốn tách hẳn thì tạo Supabase project riêng rồi đổi 2 secret — workflow không
# phải sửa gì.
# =============================================================================

on:
  push:
    branches: [test]
  workflow_dispatch: {} # migrate tay khi cần

concurrency:
  group: migrate-test
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma migrate deploy (Supabase test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kiểm tra secrets test (fail sớm, message rõ ràng)
        run: |
          missing=0
          [ -n "${{ secrets.TEST_DATABASE_URL }}" ] || { echo "::error::Thiếu secret TEST_DATABASE_URL (transaction pooler :6543) — khai ở Settings → Secrets and variables → Actions"; missing=1; }
          [ -n "${{ secrets.TEST_DIRECT_URL }}" ]   || { echo "::error::Thiếu secret TEST_DIRECT_URL (session pooler :5432) — khai ở Settings → Secrets and variables → Actions"; missing=1; }
          exit $missing

      # Chặn cấu hình nhầm nguy hiểm nhất: trỏ secret TEST vào chính DB PROD.
      # Không có bước này thì "môi trường nghiệm thu" lại migrate thẳng lên prod —
      # đúng cái rủi ro mà cổng tiền-prod sinh ra để chặn.
      - name: Chặn trỏ nhầm vào DB PROD
        run: |
          if [ -n "${{ secrets.PROD_DIRECT_URL }}" ] && [ "${{ secrets.TEST_DIRECT_URL }}" = "${{ secrets.PROD_DIRECT_URL }}" ]; then
            echo "::error::TEST_DIRECT_URL trùng PROD_DIRECT_URL — môi trường test đang trỏ vào DB PRODUCTION. Dừng."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate test DB
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      # Nền Hệ thống P0 · US-01 — nạp registry quyền vào bảng PermissionDescriptor.
      # Key trùng giữa 2 module → step ĐỎ + DB nguyên trạng (throw trước transaction).
      # Auto-seed lúc deploy: user duyệt 09/08/2026.
      # DATABASE_URL trỏ SESSION pooler (DIRECT) như seed-prod-roles.yml — tránh quirk
      # prepared-statement của transaction pooler khi chạy PrismaClient trần từ CI.
      - name: Sync permission registry
        run: pnpm db:seed:permissions
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      # 27/08/2026 — SEED VAI, bước này TRƯỚC ĐÂY KHÔNG CÓ.
      #
      # Hệ quả của việc thiếu nó, đã đo: quyền mới khai trong `prisma/seed-roles.ts` lên
      # `test` cùng code nhưng KHÔNG có trong DB, nên trên môi trường bật RBAC v2 thì
      # tính năng vừa làm xong hiện ra như "không có quyền" — trông y hệt lỗi chức năng,
      # và người nghiệm thu không có cách nào đoán ra nguyên nhân nằm ở một bước seed.
      # Đo 24/08: dev/test tụt lại 14 RoleDef so với 15 của prod vì đúng chỗ này.
      #
      # Idempotent (upsert theo code) nên chạy mỗi lượt push là an toàn.
      # ⚠️ PROD vẫn phải bấm tay `seed-prod-roles.yml` — cố ý, đổi quyền trên prod là
      # việc có người chịu trách nhiệm bấm, không phải hệ quả phụ của một lượt merge.
      - name: Seed RoleDef + RolePermission
        run: pnpm db:seed:roles
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
