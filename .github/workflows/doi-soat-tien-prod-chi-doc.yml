# Chạy TAY (workflow_dispatch) — ĐỌC PROD, KHÔNG GHI GÌ.
#
# Sinh bảng đối soát tiền để chủ dự án CHỌN CƠ SỞ bật `billing.flexV1Enabled` đầu tiên.
#
# ── BỐN LỚP KHOÁ, ĐỘC LẬP NHAU ────────────────────────────────────────────────────────
# 1. KHÔNG CÓ CHẾ ĐỘ GHI. `scripts/bao-cao-doi-soat-tien.ts` KHÔNG chứa một lời gọi ghi nào —
#    không `create`/`update`/`delete`/`upsert`, không cờ `--apply`. Chủ dự án chốt 17/09: *"cờ
#    --dry-run cứng, không tham số tắt"*. Một cờ thì lật được; một tệp không chứa lệnh ghi thì
#    không. Ca `[BCD-01]` (`lib/finance/bao-cao-chi-doc.test.ts`) quét chính tệp đó.
# 2. TRANSACTION READ ONLY + ROLLBACK. Script bọc mọi truy vấn trong `SET TRANSACTION READ ONLY`
#    rồi ném một lỗi canh sẵn để không lượt nào commit được — kể cả phép ghi do một `import` nào
#    đó kéo theo.
# 3. USER CHỈ-ĐỌC. File này CỐ Ý KHÔNG đọc `PROD_DATABASE_URL` / `PROD_DIRECT_URL` (hai secret
#    đầy quyền). Nó chỉ biết `PROD_DATABASE_URL_RO`. Gõ nhầm một dòng `run` thành lệnh ghi thì
#    Postgres vẫn từ chối. Cách tạo user: `docs/cham-cong/USER-CHI-DOC-PROD.md`.
# 4. SCRIPT TỰ KHAI. Dòng đầu báo cáo in `user=… · ghi được: CÓ/KHÔNG` (`scripts/_kiem-quyen.ts`,
#    thuần SELECT). GitHub không cho đọc lại secret để đối chiếu, nên đây là cách DUY NHẤT thấy
#    được việc secret bị đặt nhầm sang chuỗi đầy quyền.
#
# ── CHE DỮ LIỆU CÁ NHÂN ───────────────────────────────────────────────────────────────
# Báo cáo đi vào job summary + artifact, tức nó RỜI KHỎI vòng kiểm soát của DB. Nên script
# KHÔNG in tên phụ huynh/con, KHÔNG in nội dung CK, và SĐT che còn 4 số cuối. Mã đơn + cơ sở +
# số tiền là đủ để quyết định; phần còn lại chỉ thêm rủi ro.
#
# Artifact giữ 3 ngày — đủ để đọc và quyết, không đủ để thành một bản sao dữ liệu sống lâu.
#
# Dùng chuỗi SESSION POOLER (:5432), không phải transaction pooler (:6543): pgbouncer không giữ
# prepared statement giữa các câu lệnh — xem `scripts/_script-db.ts`.
name: Đối soát tiền · PROD · ĐỌC (chỉ đọc — không ghi gì)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc:
    name: Đọc và dựng bảng (không ghi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chỉ chạy trên `main` — báo cáo này để QUYẾT ĐỊNH, nên nó phải đọc bằng đúng mã đang chạy
    # trên prod. Chạy từ một nhánh feature là đọc prod bằng luật chưa merge.
    if: github.ref == 'refs/heads/main'
    steps:
      # Kiểm HÌNH DẠNG chuỗi trước khi tốn 40 giây cài đặt rồi mới chết ở Prisma.
      # KHÔNG in giá trị secret ra log — chỉ nói chỗ nào sai.
      - name: Kiểm secret chỉ-đọc
        env:
          U: ${{ secrets.PROD_DATABASE_URL_RO }}
        run: |
          if [ -z "$U" ]; then
            echo "::error::Thiếu secret PROD_DATABASE_URL_RO (chuỗi session pooler của user chỉ-đọc)."
            echo "::error::Cách tạo user + lấy chuỗi: docs/cham-cong/USER-CHI-DOC-PROD.md"
            echo "::error::KHÔNG đặt PROD_DATABASE_URL / PROD_DIRECT_URL vào đây — chúng đầy quyền."
            exit 1
          fi
          rest="${U#*://}"
          proto="${U%%://*}"
          userinfo="${rest%@*}"
          user="${userinfo%%:*}"
          hostport="${rest##*@}"
          port="${hostport##*:}"; port="${port%%/*}"
          ok=1
          case "$proto" in
            postgresql|postgres) ;;
            *) echo "::error::Chuỗi phải bắt đầu bằng postgresql:// — đang là '$proto://'"; ok=0 ;;
          esac
          case "$user" in
            *.*) ;;
            *) echo "::error::Tên user THIẾU hậu tố '.<mã dự án>' — Supavisor định tuyến theo mã dự án nằm TRONG tên user."; ok=0 ;;
          esac
          if [ "$port" != "5432" ]; then
            echo "::error::Cổng đang là '$port' — phải là 5432 (tab 'Session pooler')."
            ok=0
          fi
          [ $ok -eq 1 ] || { echo "::error::Sửa secret rồi chạy lại. Không có bước nào chạm DB."; exit 1; }
          echo "Chuỗi đúng hình dạng."

      - uses: actions/checkout@v4
      # `version` PHẢI pin: `package.json` của repo KHÔNG có khoá `packageManager`, nên thiếu dòng
      # này là action chết ngay với "No pnpm version is specified" — đã xảy ra ở lượt chạy đầu
      # tiên 17/09. 25 workflow khác đều pin `11`; lưỡi canh ở `lib/finance/bao-cao-chi-doc.test.ts`.
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `prisma generate` chỉ sinh mã client vào node_modules của runner — không chạm DB.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Dựng báo cáo (chỉ đọc)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_RO }}
          DIRECT_URL: ${{ secrets.PROD_DATABASE_URL_RO }}
        run: pnpm exec tsx scripts/bao-cao-doi-soat-tien.ts

      - name: Đưa báo cáo lên job summary
        if: always()
        run: |
          if [ -f bao-cao-doi-soat-tien.md ]; then
            cat bao-cao-doi-soat-tien.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Script không sinh được báo cáo — xem log bước trên."
          fi

      - name: Lưu artifact (3 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-doi-soat-tien
          path: bao-cao-doi-soat-tien.md
          retention-days: 3
          if-no-files-found: warn
