# Q18d — Vercel Cron KHÔNG chạy trên custom environment → site test không có cron.
# Workflow này bơm các cron SỐNG CÒN cho UAT: dispatch-events (DomainEvent outbox —
# thiếu nó mọi side-effect đứng im), email-queue (worker gửi mail), chat-zns-notify và
# trial-reminder. Danh sách thật nằm ở vòng `for` bên dưới — cron mới thêm vào
# vercel.json mà quên khai ở đây thì lần chạy đầu tiên của nó rơi thẳng vào PROD.
# /api/cron/* được miễn basic-auth trong proxy.ts — route tự verify Bearer CRON_SECRET.
#
# 01/08/2026 — BỎ GUARD HẾT HẠN. Guard cũ (tắt từ 01/08) đặt hồi 22/07 khi site
# test còn là chỗ UAT tạm. Nay `test.satarobo.vn` là MÔI TRƯỜNG TIỀN-PROD THƯỜNG
# TRỰC (nhánh `test`), nên cron phải chạy lâu dài — hết cron thì outbox đứng im và
# UAT sẽ "thấy" những lỗi không có thật.
name: cron-pump-test
on:
  schedule:
    - cron: "*/5 * * * *" # GitHub cron tối thiểu ~5 phút, có thể trễ — đủ cho UAT
    # 12/08/2026 — nhịp ĐÊM riêng cho đối soát OrgUnit (xem job `doi-soat-dem`).
    # Cùng giờ với vercel.json (`0 20 * * *` UTC = 03:00 giờ VN) để hai môi trường
    # so được với nhau.
    - cron: "0 20 * * *"
  workflow_dispatch:
jobs:
  pump:
    runs-on: ubuntu-latest
    steps:
      - name: Pump cron endpoints on test.satarobo.vn
        run: |
          set -e
          [ -n "${{ secrets.TEST_CRON_SECRET }}" ] || { echo "::error::Thiếu secret TEST_CRON_SECRET"; exit 1; }
          fail=0
          # chat-zns-notify (US-14): thêm 09/08/2026 để nghiệm thu được luồng nhắc tin
          # nhắn trên test. Trên test KHÔNG có credential Zalo ⇒ mọi tin ghi SIMULATED,
          # không có tin thật nào tới phụ huynh — đúng thứ ta cần cho UAT.
          #
          # trial-reminder (GĐ6): thêm 25/08/2026. Cron này có trong vercel.json nhưng
          # Vercel Cron KHÔNG chạy trên environment `test` ⇒ nếu không bơm ở đây thì LẦN
          # CHẠY THẬT ĐẦU TIÊN của nó sẽ là trên PROD, không có lưới nghiệm thu nào.
          # Bơm mỗi 5 phút thay vì mỗi giờ như prod là AN TOÀN: `notifyStaff` chống trùng
          # bằng dedupeKey `trial.reminder:<mốc>:<ca>:<buổi>`, gọi lại chỉ chạm bản ghi cũ
          # chứ không kêu chuông lần hai. Nhắc là chuông nội bộ cho Sale — KHÔNG gửi gì
          # cho phụ huynh, nên bơm dày cũng không có tin thật nào bay ra ngoài.
          for p in dispatch-events email-queue chat-zns-notify trial-reminder; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.TEST_CRON_SECRET }}" \
              "https://test.satarobo.vn/api/cron/$p")
            echo "$p → HTTP $code"
            if [ "$code" = "401" ]; then
              # Đã xảy ra 31/07: đỏ suốt cả ngày vì lệch secret, không ai đọc log.
              echo "::error::401 — TEST_CRON_SECRET (GitHub) không khớp CRON_SECRET của environment 'test' trên Vercel. Đồng bộ lại 2 giá trị."
              fail=1
            elif [ "$code" != "200" ]; then
              echo "::error::$p trả HTTP $code (mong đợi 200)."
              fail=1
            fi
          done
          exit $fail

  # ── Đối soát OrgUnit — MỖI ĐÊM MỘT LẦN, không đi chung nhịp 5 phút ───────────
  # Cổng P1 đòi 7 đêm đối soát sạch liên tiếp. Đo ngày 12/08: bảng OrgUnitDriftRun
  # RỖNG — cổng chưa hề bắt đầu đếm. Lý do: `/api/cron/orgunit-drift` có đăng ký
  # trong vercel.json, nhưng Vercel Cron KHÔNG chạy trên environment `test`, còn
  # workflow bơm ở trên chỉ bơm 3 endpoint khác. Tức không ai gọi nó trên môi
  # trường mà DB đang nằm.
  #
  # Tách job riêng chứ không thêm vào vòng lặp trên: một lượt đối soát quét 52
  # bảng và mất ~24 giây; chạy 288 lần/ngày là phí và làm nhiễu chính bảng log.
  doi-soat-dem:
    if: github.event.schedule == '0 20 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Đối soát OrgUnit trên test.satarobo.vn
        run: |
          set -e
          [ -n "${{ secrets.TEST_CRON_SECRET }}" ] || { echo "::error::Thiếu secret TEST_CRON_SECRET"; exit 1; }
          body=$(mktemp)
          code=$(curl -s -m 300 -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.TEST_CRON_SECRET }}" \
            "https://test.satarobo.vn/api/cron/orgunit-drift")
          body=$(cat "$body")
          echo "orgunit-drift → HTTP $code"
          echo "$body"
          [ "$code" = "200" ] || { echo "::error::orgunit-drift trả HTTP $code"; exit 1; }
          # `inconclusive` = quét được 0 dòng ⇒ "sạch" là giả, KHÔNG được tính vào
          # 7 đêm. Báo đỏ để không ai vô tình đếm nhầm đêm rỗng thành đêm sạch.
          case "$body" in
            *'"inconclusive":true'*)
              echo "::error::Đối soát trả inconclusive (quét được 0 dòng) — không tính là đêm sạch."
              exit 1;;
          esac
