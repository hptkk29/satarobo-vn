# Q18d — Vercel Cron KHÔNG chạy trên custom environment → site test không có cron.
# Workflow này bơm 2 cron SỐNG CÒN cho UAT: dispatch-events (DomainEvent outbox —
# thiếu nó mọi side-effect đứng im) + email-queue (worker gửi mail).
# /api/cron/* được miễn basic-auth trong proxy.ts — route tự verify Bearer CRON_SECRET.
#
# 01/08/2026 — BỎ GUARD HẾT HẠN. Guard cũ (tắt từ 01/08) đặt hồi 22/07 khi site
# test còn là chỗ UAT tạm. Nay `test.satarobo.vn` là MÔI TRƯỜNG TIỀN-PROD THƯỜNG
# TRỰC (nhánh `test`), nên cron phải chạy lâu dài — hết cron thì outbox đứng im và
# UAT sẽ "thấy" những lỗi không có thật.
name: cron-pump-test
on:
  schedule:
    - cron: "*/5 * * * *" # GitHub cron tối thiểu ~5 phút, có thể trễ — đủ cho UAT
  workflow_dispatch:
jobs:
  pump:
    runs-on: ubuntu-latest
    steps:
      - name: Pump cron endpoints on test.satarobo.vn
        run: |
          set -e
          [ -n "${{ secrets.TEST_CRON_SECRET }}" ] || { echo "::error::Thiếu secret TEST_CRON_SECRET"; exit 1; }
          fail=0
          for p in dispatch-events email-queue; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.TEST_CRON_SECRET }}" \
              "https://test.satarobo.vn/api/cron/$p")
            echo "$p → HTTP $code"
            if [ "$code" = "401" ]; then
              # Đã xảy ra 31/07: đỏ suốt cả ngày vì lệch secret, không ai đọc log.
              echo "::error::401 — TEST_CRON_SECRET (GitHub) không khớp CRON_SECRET của environment 'test' trên Vercel. Đồng bộ lại 2 giá trị."
              fail=1
            elif [ "$code" != "200" ]; then
              echo "::error::$p trả HTTP $code (mong đợi 200)."
              fail=1
            fi
          done
          exit $fail
