name: Migrate Production DB (Supabase)

# =============================================================================
# Mục tiêu: giữ schema Supabase PROD luôn khớp code trên main.
# Deploy code do VERCEL GIT INTEGRATION tự lo khi push main (đã chọn phương án
# này — xem lịch sử: job deploy qua Actions đã bỏ để tránh deploy trùng).
# Workflow này chỉ chạy `prisma migrate deploy` TRƯỚC, để bản Vercel build ra
# không gọi field/table chưa tồn tại trên prod.
#
# ── SECRETS cần khai (GitHub → Settings → Secrets and variables → Actions › Secrets):
#     PROD_DATABASE_URL   → Supabase transaction pooler :6543 (runtime)
#     PROD_DIRECT_URL     → Supabase session pooler     :5432 (migrate)
#
# ── Feature flags (PORTAL_V2_ENABLED, SCORM_ENABLED, CONVERT_V2_ENABLED,
#    COMMON_LOGIN_ENABLED, DISPATCHER_ENABLED, ...) set trong VERCEL PROJECT
#    → Settings → Environment Variables (Production) — KHÔNG còn inject từ đây.
#    Xem .env.example để biết danh sách + giá trị khớp localhost.
#
# ── Kiểm tra status không apply: workflow "Prod DB migrate status (read-only)".
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch: {} # cho phép bấm "Run workflow" migrate tay

# Không hủy migrate đang chạy giữa chừng
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma migrate deploy (Supabase prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kiểm tra secrets prod (fail sớm, message rõ ràng)
        run: |
          missing=0
          [ -n "${{ secrets.PROD_DATABASE_URL }}" ] || { echo "::error::Thiếu secret PROD_DATABASE_URL (Supabase transaction pooler :6543) — khai ở Settings → Secrets and variables → Actions"; missing=1; }
          [ -n "${{ secrets.PROD_DIRECT_URL }}" ]   || { echo "::error::Thiếu secret PROD_DIRECT_URL (Supabase session pooler :5432) — khai ở Settings → Secrets and variables → Actions"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate prod DB
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      # Nền Hệ thống P0 · US-01 — nạp registry quyền vào bảng PermissionDescriptor.
      # Key trùng giữa 2 module → step ĐỎ + DB nguyên trạng (throw trước transaction).
      # Lưu ý: workflow này KHÔNG gate Vercel — code vẫn lên prod khi step đỏ; cổng
      # chặn chính là unit test TS-01 ở PR (ci.yml). Auto-seed: user duyệt 09/08/2026.
      # DATABASE_URL trỏ SESSION pooler (DIRECT) như seed-prod-roles.yml — tránh quirk
      # prepared-statement của transaction pooler khi chạy PrismaClient trần từ CI.
      - name: Sync permission registry
        run: pnpm db:seed:permissions
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
