name: Seed dữ liệu TEST (nạp lại từ đầu)

# =============================================================================
# NẠP DỮ LIỆU NGHIỆP VỤ CHO DB CỦA MÔI TRƯỜNG `test`.
#
# ── Vì sao cần một workflow riêng cho việc này ────────────────────────────────
# DB dev/test đã bị xoá sạch BỐN lần trong sáu ngày (23/08 ba lần, 26/08 một lần
# — lần cuối do `prisma migrate diff --shadow-database-url` trỏ nhầm Supabase).
# Mỗi lần dựng lại, người trực phải tự nhớ đúng thứ tự bảy bước seed và tự cầm
# chuỗi kết nối. Thứ tự sai thì seed sau không tìm thấy dữ liệu seed trước tạo ra,
# và lỗi hiện ra dưới dạng "màn trắng" chứ không phải thông báo rõ ràng.
#
# Workflow này biến việc đó thành một nút bấm, và quan trọng hơn: **không ai phải
# cầm chuỗi kết nối DB test nữa** — nó đọc từ secret, giống migrate-test.yml.
#
# ── Chạy khi nào ──────────────────────────────────────────────────────────────
#   · vừa dựng DB test mới (đổi Supabase project)
#   · DB test bị xoá / bị reset
#   · muốn làm mới bộ dữ liệu nghiệm thu
#
# CHẠY TAY, KHÔNG tự chạy theo push: đây là ghi dữ liệu diện rộng, phải có người
# bấm và người đó chịu trách nhiệm.
#
# ── Điều kiện tiên quyết ──────────────────────────────────────────────────────
# Chạy `Migrate TEST DB` TRƯỚC (nó tạo bảng + seed registry quyền + seed vai).
# DB chưa có bảng thì workflow này đỏ ngay bước đầu.
#
# ── An toàn ───────────────────────────────────────────────────────────────────
# ── Vì sao cần lối đi `chi_cham_cong` (06/09/2026) ────────────────────────────
# ⚠️ Lời hứa "mọi bước seed đều CHỈ THÊM/CẬP NHẬT" ở ngay dưới KHÔNG đúng với bước
# nền `db:seed`: `prisma/seed.ts:162` gọi `db.course.deleteMany()` cho mọi khoá học
# không nằm trong danh sách trong mã, và bước cơ sở in "removed N cơ sở cũ". Ngày
# 06/09 chạy thử đã đỏ ngay ở đó — `Class_courseId_fkey` chặn lại nên KHÔNG mất gì,
# nhưng trên DB mà khoá học chưa có lớp tham chiếu thì nó xoá thật.
# Vì vậy: khi DB test đang có người nghiệm thu, dùng `chi_cham_cong` để đi thẳng vào
# hai bước chấm công (cả hai chỉ upsert/insert, đã đo idempotent) và không đụng nền.
#
#   · dispatch-only + phải gõ đúng chuỗi xác nhận
#   · chặn `TEST_DIRECT_URL` trùng `PROD_DIRECT_URL` (cùng lưới với migrate-test)
#   · mọi bước seed đều CHỈ THÊM/CẬP NHẬT (upsert), không có câu xoá nào
#   · dùng TEST_DIRECT_URL (session pooler :5432) cho mọi bước — PrismaClient trần
#     chạy qua transaction pooler :6543 sẽ đâm `42P05 prepared statement "s0" already exists`
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      xac_nhan:
        description: 'Gõ đúng chữ SEED-TEST để xác nhận nạp dữ liệu vào DB test'
        required: true
        default: ''
      bo_du_lieu_uat:
        description: 'Nạp cả bộ dữ liệu UAT (lead/học viên/lớp/ảnh/trial)? Bỏ chọn = chỉ nạp nền.'
        type: boolean
        required: false
        default: true
      du_lieu_cham_cong:
        description: 'Nạp dữ liệu nghiệm thu CHẤM CÔNG (khung ca tuần → lưới phân ca → lượt quét → công ngày)? Cần bộ UAT đã có nhân sự.'
        type: boolean
        required: false
        default: true
      ky_cham_cong:
        description: 'Chỉ nạp MỘT kỳ chấm công, dạng YYYY-MM (vd 2026-08). Để trống = 2 kỳ gần nhất. Dùng khi muốn chia nhỏ cho chắc ăn.'
        required: false
        default: ''
      chi_cham_cong:
        description: 'CHỈ nạp dữ liệu chấm công, BỎ QUA mọi bước nền. Dùng khi DB test đang có người nghiệm thu — xem ghi chú "Vì sao cần lối đi này" trong file.'
        type: boolean
        required: false
        default: false
      chi_lich_hen:
        description: 'CHỈ nạp lịch hẹn học thử, bỏ qua mọi bước khác. Dùng khi DB đã có dữ liệu và không muốn seed đè lên thao tác của người đang nghiệm thu.'
        type: boolean
        required: false
        default: false
      # ── MƯỢN NÚT NÀY để nối học viên cũ ↔ lead trên DB test [26/09/2026] ──────────
      # GitHub chỉ nhận lệnh chạy tay cho workflow ĐÃ TỪNG có mặt trên `main`; một workflow
      # mới cho script này sẽ 404 cho tới lượt test → main. Cùng cách đợt hoá đơn mượn nút
      # "Ngưỡng thanh toán" (8f964d48). Chọn khác `khong` ⇒ job `seed` BỎ QUA hoàn toàn, chỉ
      # job `noi-hoc-vien-lead` chạy — không đụng một bước seed nào.
      noi_hoc_vien_lead:
        description: 'CHỈ nối học viên ↔ lead, BỎ QUA mọi bước seed. chay-thu/ghi = script nối HV cũ theo bằng chứng (ghi cần ô bên dưới); seed-uat = dựng phiếu lead nguồn cho học viên UAT (prisma/seed-uat/chay-noi-lead.ts).'
        type: choice
        required: false
        default: khong
        options:
          - khong
          - chay-thu
          - ghi
          - seed-uat
      noi_hoc_vien_expect:
        description: 'Chỉ dùng với "ghi": số "SẼ NỐI" của lượt chay-thu vừa xem. Lệch ⇒ script không ghi gì.'
        required: false
        default: ''
      # ── Nhận xét buổi + học bạ "lấy từ giáo viên nhập" [26/09/2026] ──────────────────
      # Chạy scripts/seed-thu-nhan-xet-giao-vien.ts + seed-thu-hoc-ba-giao-vien.ts: đi qua ĐÚNG
      # hàm lõi màn giáo viên / quản lý gọi (người thao tác = GV đứng lớp / QL cơ sở), thay dữ
      # liệu bộ seed UAT chèn thẳng bảng. Email phụ huynh TẮT ở đường seed (guiEmailPhuHuynh=false).
      nhan_xet_hoc_ba:
        description: 'CHỈ seed lại nhận xét buổi + học bạ qua đường giáo viên, BỎ QUA mọi bước seed khác. chay-thu = chỉ đếm; ghi = xoá dữ liệu seed chèn thẳng bảng rồi nhập lại qua đường thật.'
        type: choice
        required: false
        default: khong
        options:
          - khong
          - chay-thu
          - ghi

concurrency:
  group: seed-test-data
  cancel-in-progress: false

jobs:
  # Nối học viên cũ về lead nguồn (Student.leadId) — runbook: docs/hoc-vien-lien-ket-lead.md §4.
  # Hai cổng của chính script vẫn nguyên: ghi phải kèm --expect=N khớp kế hoạch lúc chạy, và
  # dòng tự khai quyền. Input đi qua `env`, không nội suy thẳng vào `run` (khuôn chống chèn lệnh).
  noi-hoc-vien-lead:
    name: Nối học viên cũ ↔ lead (DB test)
    if: ${{ inputs.noi_hoc_vien_lead == 'chay-thu' || inputs.noi_hoc_vien_lead == 'ghi' || inputs.noi_hoc_vien_lead == 'seed-uat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Xác nhận chủ ý
        env:
          XAC_NHAN: ${{ inputs.xac_nhan }}
        run: |
          if [ "$XAC_NHAN" != "SEED-TEST" ]; then
            echo "::error::Chưa xác nhận. Gõ đúng SEED-TEST vào ô xác nhận rồi chạy lại."
            exit 1
          fi

      - name: Chặn trỏ nhầm vào DB PROD
        run: |
          [ -n "${{ secrets.TEST_DIRECT_URL }}" ] || { echo "::error::Thiếu secret TEST_DIRECT_URL"; exit 1; }
          if [ -n "${{ secrets.PROD_DIRECT_URL }}" ] && [ "${{ secrets.TEST_DIRECT_URL }}" = "${{ secrets.PROD_DIRECT_URL }}" ]; then
            echo "::error::TEST_DIRECT_URL trùng PROD_DIRECT_URL — đây là DB PRODUCTION. Dừng."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Nhánh `*)` KHÔNG rơi về dry-run: lựa chọn lạ là lỗi cấu hình, phải đỏ.
      - name: Nối học viên ↔ lead
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          CHE_DO: ${{ inputs.noi_hoc_vien_lead }}
          SO_DUYET: ${{ inputs.noi_hoc_vien_expect }}
        run: |
          case "$CHE_DO" in
            chay-thu) pnpm exec tsx scripts/noi-hoc-vien-voi-lead.ts ;;
            ghi)
              if ! printf '%s' "$SO_DUYET" | grep -Eq '^[0-9]+$'; then
                echo "::error::Chế độ ghi cần ô noi_hoc_vien_expect là số nguyên (số SẼ NỐI của lượt chay-thu)."
                exit 1
              fi
              pnpm exec tsx scripts/noi-hoc-vien-voi-lead.ts --ghi "--expect=$SO_DUYET" ;;
            # Dữ liệu UAT: dựng phiếu lead nguồn đã chốt cho từng học viên seed + nối + vết chốt.
            # Lối riêng, KHÔNG qua index.ts (bước nền ở đó đặt lại mật khẩu uat.* và giá khoá học).
            seed-uat) UAT_SEED=1 pnpm exec tsx prisma/seed-uat/chay-noi-lead.ts ;;
            *) echo "::error::Lựa chọn lạ: $CHE_DO"; exit 1 ;;
          esac

  # Nhận xét buổi + học bạ qua đường giáo viên — xem ô chọn `nhan_xet_hoc_ba`. Hai script tự chặn
  # DB không-local trừ khi có SEED_THU_DB_TEST=1 (chỉ job này đặt, sau bước chặn secret trùng PROD).
  nhan-xet-hoc-ba:
    name: Nhận xét buổi + học bạ qua đường giáo viên (DB test)
    if: ${{ inputs.nhan_xet_hoc_ba == 'chay-thu' || inputs.nhan_xet_hoc_ba == 'ghi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Xác nhận chủ ý
        env:
          XAC_NHAN: ${{ inputs.xac_nhan }}
        run: |
          if [ "$XAC_NHAN" != "SEED-TEST" ]; then
            echo "::error::Chưa xác nhận. Gõ đúng SEED-TEST vào ô xác nhận rồi chạy lại."
            exit 1
          fi

      - name: Chặn trỏ nhầm vào DB PROD
        run: |
          [ -n "${{ secrets.TEST_DIRECT_URL }}" ] || { echo "::error::Thiếu secret TEST_DIRECT_URL"; exit 1; }
          if [ -n "${{ secrets.PROD_DIRECT_URL }}" ] && [ "${{ secrets.TEST_DIRECT_URL }}" = "${{ secrets.PROD_DIRECT_URL }}" ]; then
            echo "::error::TEST_DIRECT_URL trùng PROD_DIRECT_URL — đây là DB PRODUCTION. Dừng."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Nhận xét TRƯỚC học bạ: phát hành học bạ đóng băng số liệu (gồm nhận xét) vào snapshot.
      - name: Nhận xét buổi + học bạ
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          SEED_THU_DB_TEST: "1"
          CHE_DO: ${{ inputs.nhan_xet_hoc_ba }}
        run: |
          case "$CHE_DO" in
            chay-thu) GHI="" ;;
            ghi) GHI="--ghi" ;;
            *) echo "::error::Lựa chọn lạ: $CHE_DO"; exit 1 ;;
          esac
          pnpm exec tsx scripts/seed-thu-nhan-xet-giao-vien.ts --thay-seed-cu --xoa-toan-bo-seed-cu $GHI
          pnpm exec tsx scripts/seed-thu-hoc-ba-giao-vien.ts --thay-seed-cu --xoa-toan-bo-seed-cu $GHI

  seed:
    name: Seed dữ liệu vào DB test
    if: ${{ (inputs.noi_hoc_vien_lead == '' || inputs.noi_hoc_vien_lead == 'khong') && (inputs.nhan_xet_hoc_ba == '' || inputs.nhan_xet_hoc_ba == 'khong') }}
    runs-on: ubuntu-latest
    # 50 chứ không 30: seed chấm công nói chuyện với Supabase, mỗi phép tính công là vài lượt
    # đi–về (~2 giây/ngày-người) nên nó bị cắt giữa chừng ở lượt 06/09. Đây là workflow bấm tay
    # để nạp dữ liệu, kéo dài ngân sách không hại ai; bị CẮT giữa chừng mới hại — dữ liệu vào
    # một nửa và người bấm phải tự đoán nửa nào.
    timeout-minutes: 50
    steps:
      - name: Xác nhận chủ ý
        run: |
          if [ "${{ inputs.xac_nhan }}" != "SEED-TEST" ]; then
            echo "::error::Chưa xác nhận. Gõ đúng SEED-TEST vào ô xác nhận rồi chạy lại."
            exit 1
          fi

      - name: Kiểm tra secrets test
        run: |
          missing=0
          [ -n "${{ secrets.TEST_DIRECT_URL }}" ] || { echo "::error::Thiếu secret TEST_DIRECT_URL (session pooler :5432)"; missing=1; }
          exit $missing

      # Cùng lưới với migrate-test.yml: cấu hình nhầm nguy hiểm nhất là trỏ secret
      # TEST vào chính DB PROD — ở đây hậu quả còn nặng hơn migrate, vì workflow này
      # ĐỔ DỮ LIỆU GIẢ (100 lead, 250 học viên UAT) vào chỗ đó.
      - name: Chặn trỏ nhầm vào DB PROD
        run: |
          if [ -n "${{ secrets.PROD_DIRECT_URL }}" ] && [ "${{ secrets.TEST_DIRECT_URL }}" = "${{ secrets.PROD_DIRECT_URL }}" ]; then
            echo "::error::TEST_DIRECT_URL trùng PROD_DIRECT_URL — đây là DB PRODUCTION. Dừng."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # ── Nền: cây đơn vị → phòng ban → dữ liệu gốc ────────────────────────────
      # THỨ TỰ BẮT BUỘC. `seed-uat` gọi `layCoSo()` và ném ngay nếu chưa có CS1/CS2,
      # còn `seed.ts` cần phòng ban để dựng hồ sơ nhân sự.
      - name: Seed cây đơn vị (HO → REGION → CS1/CS2)
        if: ${{ !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm db:seed:orgunit
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      - name: Seed phòng ban
        if: ${{ !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm db:seed:departments
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      - name: Seed dữ liệu gốc (khoá học, nội dung web, tài khoản CEO)
        if: ${{ !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm db:seed
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      # ── Bộ UAT: 12 tài khoản uat.* + dữ liệu nghiệp vụ ──────────────────────
      - name: Seed bộ UAT (12 tài khoản + lead/học viên/lớp)
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm db:seed:uat
        env:
          UAT_SEED: "1"
          DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}"
          DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}"

      - name: Seed ảnh chờ duyệt
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm exec tsx prisma/seed-uat-media-review.ts
        env:
          UAT_SEED: "1"
          DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}"
          DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}"

      - name: Backfill kho ảnh (MediaAsset)
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm exec tsx scripts/backfill-media-assets.ts
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      # Lớp trial: buổi + điểm danh + phiếu đánh giá + dời lịch. Không có bước này
      # thì màn Lớp Trial mở ra có danh sách lớp nhưng bên trong rỗng — không bấm
      # được gì để nghiệm thu.
      - name: Seed dữ liệu lớp trial
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm exec tsx prisma/seed-uat-trial.ts
        env:
          UAT_SEED: "1"
          DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}"
          DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}"

      # PHẢI chạy SAU seed trial: nó phân loại ca theo người đưa vào lớp, mà ca thì
      # bước trên vừa tạo. Chạy trước là không có gì để phân loại.
      - name: Backfill giáo viên học thử (phương án B)
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        run: pnpm exec tsx scripts/backfill-gv-trial-phuong-an-b.ts
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      # Lịch hẹn học thử (hệ V1) — tab thứ hai của màn Lớp Trial. Từ 26/08
      # `updateLeadStatus` thôi tự đẻ bản ghi V1 và bộ seed UAT cũng không tạo dòng
      # nào, nên tab đó mở ra là danh sách trắng.
      #
      # PHẢI chạy SAU `db:seed:uat`: script bám vào lead ĐÃ CÓ CƠ SỞ, không tự tạo lead.
      # DB chưa có lead nào thì nó in "chưa có lead" rồi thoát 0 — không đỏ, nhưng cũng
      # không nạp được gì.
      # ── Chấm công v3 ─────────────────────────────────────────────────────────
      # `seed-cham-cong.ts` CỐ Ý chỉ nạp DANH MỤC (21 mã ca · 8 loại nghỉ · điểm chấm
      # công) vì trên prod lưới ca đến từ import Sheet thật. Trên test thì không ai
      # import Sheet, nên nếu dừng ở đây thì Bảng công ngày / Lưới phân ca / Kỳ công
      # mở ra RỖNG ở mọi tháng — đúng ba màn nặng nhất của module lại không nghiệm thu
      # được. `seed-cham-cong-demo.ts` lấp chỗ đó bằng cách đi qua chính các hàm thật
      # (sinh lưới từ khung, ghi lượt quét, tính công), nên cờ và số liệu ra là do
      # engine sinh chứ không phải số bịa sẵn.
      #
      # PHẢI chạy SAU `db:seed:uat`: nó bám vào nhân sự ĐÃ CÓ, không tự tạo người.
      - name: Seed danh mục chấm công (21 mã ca + 8 loại nghỉ + điểm chấm công)
        if: ${{ inputs.du_lieu_cham_cong && !inputs.chi_lich_hen }}
        run: pnpm db:seed:cham-cong
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}" }

      - name: Seed dữ liệu nghiệm thu chấm công (2 kỳ gần nhất)
        if: ${{ inputs.du_lieu_cham_cong && !inputs.chi_lich_hen }}
        run: pnpm exec tsx prisma/seed-cham-cong-demo.ts --nguoi=10 ${{ inputs.ky_cham_cong && format('--ky={0}', inputs.ky_cham_cong) || '' }}
        # `SEED_ALLOW_REMOTE=1`: script có cổng `assertLocalDb` chặn ghi DB không-local. DB
        # test là Supabase chứ không phải localhost nên lượt NÀY phải khai chủ đích. An toàn
        # vì bước "Kiểm secret" ở trên đã từ chối khi TEST_DIRECT_URL trùng PROD_DIRECT_URL.
        env: { DATABASE_URL: "${{ secrets.TEST_DIRECT_URL }}", DIRECT_URL: "${{ secrets.TEST_DIRECT_URL }}", SEED_ALLOW_REMOTE: "1" }

      # 26/09 — bộ UAT (03-hoc-vu, 05-lms) còn CHÈN THẲNG BẢNG nhận xét buổi + học bạ. Thay bằng
      # dữ liệu đi qua đường giáo viên để lượt seed đầy đủ không quay lại dữ liệu "không phải
      # giáo viên nhập" (chủ dự án 26/09). PHẢI sau bộ UAT: cần lớp, buổi, điểm danh đã có.
      - name: Nhận xét buổi + học bạ qua đường giáo viên
        if: ${{ inputs.bo_du_lieu_uat && !inputs.chi_lich_hen && !inputs.chi_cham_cong }}
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          SEED_THU_DB_TEST: "1"
        run: |
          pnpm exec tsx scripts/seed-thu-nhan-xet-giao-vien.ts --thay-seed-cu --xoa-toan-bo-seed-cu --ghi
          pnpm exec tsx scripts/seed-thu-hoc-ba-giao-vien.ts --thay-seed-cu --xoa-toan-bo-seed-cu --ghi

      - name: Tóm tắt
        run: |
          echo "### Đã nạp dữ liệu vào DB test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Xem số dòng từng bảng ở log các bước trên." >> $GITHUB_STEP_SUMMARY
          echo "Bước tiếp theo: **redeploy Vercel environment \`test\`** để bản đang chạy nối vào DB này." >> $GITHUB_STEP_SUMMARY
