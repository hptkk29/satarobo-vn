      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
