name: CI

on:
  push:
    # `test` = nhánh tiền-prod (chốt 01/08/2026), Vercel environment `test` bám
    # nhánh này. CI phải chạy ở đây, không thì cổng nghiệm thu chỉ có UAT tay.
    # (`develop` là tàn dư, giữ để không phá nhánh cũ nếu ai đó còn dùng.)
    branches: [main, test, develop]
  pull_request:
    branches: [main, test, develop]

# Cancel in-progress runs when new commits land on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build cần Prisma client + DB connection. Postgres service container chạy
  # ở mọi job dùng `pnpm build` (quality + e2e). Migrate deploy trước build.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

jobs:
  quality:
    name: Quality (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Boundaries (dependency-cruiser)
        # Architecture governance (Doc 15 §4.10). Hiện chỉ chặn rule severity 'error'
        # (circular / unresolvable / not-to-test / deep cross-module import).
        # Rule app→lib/db đang 'warn' (không fail) tới khi A0-04 (scopedDb) hoàn tất → đổi 'error'.
        run: pnpm lint:boundaries

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      # Canary secret trong bundle client — variables.md liệt đây là cổng BẮT BUỘC trước
      # go-live nhưng tới 09/08/2026 chưa có bước nào thực thi. Lý lẽ đầy đủ + vì sao KHÔNG
      # dùng `grep service_role` nằm ngay đầu file script (grep vừa kêu oan trên bản build
      # sạch vì chuỗi trong @supabase/supabase-js, vừa bỏ lọt khoá đời cũ vì nó là JWT).
      - name: Canary — không secret nào lọt bundle client
        run: node scripts/canary-client-bundle-keys.mjs

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test:unit -- --run --reporter=verbose

  chat-db-tests:
    name: Chat DB invariants (Vitest + Postgres local)
    # Job `unit-tests` KHÔNG có Postgres ⇒ mọi spec `tests/chat` (describe.skipIf) skip
    # sạch ở đó. Job này là nơi DUY NHẤT tầng DB của module chat thật sự chạy trong CI:
    # thiếu nó, đột biến kiểu `leavers = existing.filter(() => false)` (PH bị gỡ khỏi lớp
    # vẫn đọc được nhóm) vẫn cho CI XANH.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # HAS_LOCAL_DB của tests/chat/*.spec.ts nhận host localhost + db ci_test.
      # KHÔNG dùng ${{ env.* }} ở job-level env (GitHub Actions cấm) — ghi literal.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema (local CI Postgres)
        run: pnpm exec prisma migrate deploy

      # RBAC v2 lấy quyền từ DỮ LIỆU (RoleDef + RolePermission), không từ code. Không seed
      # thì `parent-permission.spec.ts` không có RoleDef PARENT để đọc — mà đó đúng là bài
      # test canh sự cố 10/08 (114 phụ huynh / 0 UserOrgRole ⇒ không gửi được tin nào).
      - name: Seed RoleDef + RolePermission (dữ liệu quyền v2)
        run: pnpm exec tsx prisma/seed-roles.ts

      - name: Run chat DB tests
        # = `pnpm test:chat-db` chạy tay được y hệt (vitest run tests/chat).
        run: pnpm test:chat-db

      # P2 · US-08 — TS-08 (quyền theo Position) cũng cần Postgres thật. Dùng chung job
      # này thay vì dựng job mới: cùng service, cùng seed RoleDef, chạy thêm ~10 giây.
      - name: Run nền-hệ-thống DB tests
        run: pnpm test:nen-db

      # Nhận lead từ nguồn ngoài (form Sale / quatang) — cùng lý do như 2 bước trên:
      # `tests/lead-intake` có `describe.skipIf(!RUN)` nên ở job `unit-tests` (không có
      # Postgres) nó SKIP SẠCH. Thiếu bước này thì xoá trắng luật QĐ-D1 ("trùng SĐT
      # khác con ⇒ gắn thêm LeadChild") vẫn cho CI xanh — đúng thứ job này sinh ra để
      # chặn.
      - name: Run lead-intake DB tests
        run: pnpm test:lead-intake

      # S9-B5 (06/09/2026) — LẦN ĐẦU 14 ca HT-01…HT-14 (tests/inbox/hop-thu.spec.ts)
      # thật sự chạy trong CI. Script `test:inbox-db` có trong package.json từ đợt hộp
      # thư nhưng KHÔNG job nào gọi ⇒ ở job `unit-tests` (không Postgres) cổng
      # `describe.skipIf(!RUN)` cho chúng SKIP SẠCH và CI vẫn xanh 100% dù logic hộp
      # thư bị phá hoàn toàn — đúng kiểu "xanh giả" nguy hiểm hơn đỏ.
      # Không cần job mới: job này đã có Postgres 16, `prisma migrate deploy` (dựng cả
      # migration 20260827120000_hop_thu_da_kenh ⇒ cổng `CO_BANG` mở) và seed RoleDef.
      # ⚠️ Bộ này KHÔNG gọi `resetDb()` — nó dọn theo tiền tố `HTDK_`. Giữ nguyên thói
      # quen đó cho mọi spec thêm vào `tests/inbox`: 4 bộ trên dùng CHUNG một DB
      # `ci_test` chạy tuần tự, một `resetDb()` lọt vào là xoá dữ liệu của bộ chạy sau.
      - name: Run inbox DB tests
        run: pnpm test:inbox-db
      # CHẤM CÔNG — thêm 07/09/2026. Cùng lý do ba bước trên, nhưng ca này đã ĐỎ THẬT MÀ KHÔNG AI
      # THẤY: `tests/cham-cong/timelog.spec.ts` kỳ vọng 3 lượt ACCEPTED trong khi luật chặn định vị
      # (06/09) chỉ cho qua 1. Bộ này nằm trong `include` của Vitest nên `pnpm test:unit` có GOM
      # file, nhưng 5/6 file tự `describe.skip` khi thiếu Postgres — mà job `unit-tests` không có
      # Postgres. Kết quả: CI xanh trong lúc bộ test vé kiosk / kỳ công / tính lại / ma trận duyệt
      # đơn (~52KB spec) không chạy một dòng nào.
      #
      # Đây đúng loại lỗi module này đang dọn cả tuần: thứ có thật mà không ai đọc.
      # Kế hoạch chấm công v3 đã chốt bước này từ đầu (KE-HOACH-CHAM-CONG-v3.md:414) — chỉ là chưa
      # ai thêm vào đây.
      - name: Run chấm-công DB tests
        run: pnpm test:cham-cong-db
      # Bước 6 — bút toán ĐIỀU CHỈNH khoản thu. Cùng lý do như 3 bước trên: bộ này có
      # `describe.skipIf(!RUN_DB_TESTS)` nên ở job `unit-tests` (không Postgres, không
      # ALLOW_DB_RESET) nó SKIP SẠCH. Thiếu bước này thì bản sửa "điều chỉnh lưu DELTA,
      # dòng gốc bất biến, trần học phí không tự cắt số" KHÔNG có gì canh — mà đó là
      # đường ghi TIỀN THẬT đã đối soát sao kê.
      - name: Run finance (điều chỉnh khoản thu) DB tests
        run: pnpm test:finance-db

      # Cổng dữ liệu agent (25/09/2026) — bộ kiểm thử bảo mật spec CEO §14.2 (B1–B17):
      # thu hồi có hiệu lực ngay, tự duyệt bị chặn, IP lạ tự khoá, công tắc 503 ngay, lệch
      # khuôn không trả dữ liệu. Cổng mở dữ liệu ra NGOÀI satarobo — không có lưới này thì
      # một lượt sửa pipeline làm hở một bước kiểm mà không ai biết.
      - name: Run agent gateway DB tests
        run: pnpm test:agent-db

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # PR + main + `test`. Trước 11/08 job này skip trên `test`, mà `test` là nhánh
    # TIỀN-PROD (chốt 01/08) — hệ quả: spec smoke mục nát dần suốt các đợt chat mà
    # không ai thấy, rồi nổ ở PR đầu tiên nhắm vào `test` (PR #106: 4 test đỏ vì màn
    # admin bỏ tiêu đề "Tin nhắn" và portal thêm cổng chính sách US-16).
    # Chỉ `develop` còn được bỏ qua để tiết kiệm CI.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      - name: Seed DB (cho E2E có data thật)
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install lần $lan treo hoặc lỗi — thử lại"
            sleep 10
          done
          echo "::error::playwright install hỏng cả 3 lần — thường là mirror apt của runner, chạy lại job"
          exit 1

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          # ── CỔNG CHẶN BRUTE-FORCE ĐĂNG NHẬP, TẮT TRONG MÔI TRƯỜNG TEST [21/09/2026] ──
          #
          # `lib/auth.ts:132` chặn 10 lượt/phút theo IP và **5 lượt/phút theo ĐỊNH DANH**;
          # bộ đếm nằm trong BỘ NHỚ TIẾN TRÌNH server nên `resetDb()` không xoá được. Bộ
          # E2E qua trình duyệt đăng nhập lại nhiều lần bằng vài tài khoản ⇒ vượt trần ⇒
          # `authorize()` trả `null`, trang Ở LẠI `/login` **không ném lỗi nào**, và mỗi ca
          # hết 30 giây mới chịu thua. Với hàng chục ca × retry, job chạm `timeout-minutes`
          # và bị GIẾT. Đó là lý do bốn job cần trình duyệt treo suốt từ 21/09.
          #
          # ⚠️ Đây KHÔNG phải nâng trần thời gian — nguyên nhân đã đo được, và đây là cửa
          # thoát mà chính `lib/auth.ts:128` khai ra cho đúng tình huống này. Prod KHÔNG đổi
          # một dòng nào.
          #
          # ⚠️ Vế IP đã được chữa ĐÚNG CÁCH ở `tests/e2e/_helpers/auth.ts` (mỗi lượt đăng
          # nhập một IP riêng — cùng tiền lệ `forgot-password.spec.ts`). Thứ CÒN LẠI buộc
          # phải tắt là vế ĐỊNH DANH: nó chỉ chữa được bằng cách cho mỗi ca một email, mà
          # làm vậy cho ~20 spec đang có là một đợt riêng.
          #
          # ⚠️ Mẫu KHÔNG cần cửa thoát này đã có: `tests/e2e/a0/thu-tien-theo-con.spec.ts`
          # cho mỗi ca một email và chạy 3 lượt liên tiếp 5/5 xanh **với cổng chặn BẬT**.
          # Spec mới nên theo mẫu đó; ngày nào ~20 spec cũ theo hết thì gỡ dòng dưới đây.
          LOGIN_RATELIMIT_DISABLED: "1"

      - name: Run Playwright smoke tests
        # ── NỢ-16: CHỤP CÂY TIẾN TRÌNH ĐÚNG LÚC ĐANG TREO ──────────────────────
        # Bốn job dựng `webServer` treo SAU khi chạy xong ca cuối rồi bị `timeout-minutes`
        # (20 phút) giết — và runner giết sạch luôn mọi chứng cứ. Reporter `line` cho
        # biết ca cuối là ca nào, nhưng KHÔNG nói được vì sao tiến trình không thoát.
        #
        # Chó canh dưới đây in cây tiến trình ở phút 12 — lúc đó đã biết chắc là treo,
        # mà job còn sống nên log vẫn ra được. Nó CHỈ ĐỌC: không gửi tín hiệu nào cho bộ
        # test, nên không làm sai lệch chính thứ đang đo.
        #
        # Dấu vết đã có: runner phải "Terminate orphan process: (sh)" và
        # "(next-server (v16.2.6))" ở bước dọn dẹp ⇒ chuỗi
        # `pnpm start` → sh → next start → next-server để lọt tiến trình cháu.
        # Cây tiến trình sẽ cho thấy CHÍNH XÁC cái nào còn sống và cha nó là ai.
        #
        # `DEBUG=pw:webserver` để Playwright tự kể nó gửi tín hiệu gì, lúc nào.
        # ⛔ KHÔNG nâng `timeout-minutes` — trần không phải chỗ hỏng.
        run: |
          (
            # NGỦ THÀNH TỪNG GIÂY, không `sleep 12m` một phát. `trap` chỉ giết được
            # SUBSHELL, còn `sleep` là CON của nó nên sống sót và GIỮ STDOUT đã thừa kế
            # => runner ngồi chờ hết ngần ấy phút dù bộ test xong từ lâu. Đo thật: bản
            # `sleep 5` làm một lệnh 1 giây mất 5 giây. Ngủ từng giây thì mất mát tối đa
            # là MỘT giây.
            for _ in $(seq 1 720); do sleep 1; done
            echo "::warning title=NỢ-16::Đã 12 phút — bộ test chưa thoát. Chụp cây tiến trình."
            echo "──────── ps -ef --forest ────────"
            ps -ef --forest 2>/dev/null | tail -60 || ps -ef | tail -60
            echo "──────── cổng đang nghe ────────"
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -20
            echo "────────────────────────────────"
          ) &
          CHO_CANH=$!
          # BẮT BUỘC dùng `trap`, không phải một dòng `kill` ở cuối: GitHub chạy khối này
          # bằng `bash -e`, nên lệnh test ĐỎ là kịch bản thoát NGAY và dòng `kill` phía dưới
          # không bao giờ chạy. Khi đó `sleep` còn sống sẽ GIỮ STDOUT MỞ và runner ngồi chờ
          # hết 12/16 phút — biến một job 5 phút thành job chạm trần. Tức cái đèn tự gây ra
          # đúng thứ nó sinh ra để soi.
          trap 'kill "$CHO_CANH" 2>/dev/null || true' EXIT
          pnpm test:e2e
          MA=$?
          kill "$CHO_CANH" 2>/dev/null || true
          exit $MA
        env:
          DEBUG: pw:webserver
          BASE_URL: "http://localhost:3000"
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          # ── CỔNG CHẶN BRUTE-FORCE ĐĂNG NHẬP, TẮT TRONG MÔI TRƯỜNG TEST [21/09/2026] ──
          #
          # `lib/auth.ts:132` chặn 10 lượt/phút theo IP và **5 lượt/phút theo ĐỊNH DANH**;
          # bộ đếm nằm trong BỘ NHỚ TIẾN TRÌNH server nên `resetDb()` không xoá được. Bộ
          # E2E qua trình duyệt đăng nhập lại nhiều lần bằng vài tài khoản ⇒ vượt trần ⇒
          # `authorize()` trả `null`, trang Ở LẠI `/login` **không ném lỗi nào**, và mỗi ca
          # hết 30 giây mới chịu thua. Với hàng chục ca × retry, job chạm `timeout-minutes`
          # và bị GIẾT. Đó là lý do bốn job cần trình duyệt treo suốt từ 21/09.
          #
          # ⚠️ Đây KHÔNG phải nâng trần thời gian — nguyên nhân đã đo được, và đây là cửa
          # thoát mà chính `lib/auth.ts:128` khai ra cho đúng tình huống này. Prod KHÔNG đổi
          # một dòng nào.
          #
          # ⚠️ Vế IP đã được chữa ĐÚNG CÁCH ở `tests/e2e/_helpers/auth.ts` (mỗi lượt đăng
          # nhập một IP riêng — cùng tiền lệ `forgot-password.spec.ts`). Thứ CÒN LẠI buộc
          # phải tắt là vế ĐỊNH DANH: nó chỉ chữa được bằng cách cho mỗi ca một email, mà
          # làm vậy cho ~20 spec đang có là một đợt riêng.
          #
          # ⚠️ Mẫu KHÔNG cần cửa thoát này đã có: `tests/e2e/a0/thu-tien-theo-con.spec.ts`
          # cho mỗi ca một email và chạy 3 lượt liên tiếp 5/5 xanh **với cổng chặn BẬT**.
          # Spec mới nên theo mẫu đó; ngày nào ~20 spec cũ theo hết thì gỡ dòng dưới đây.
          LOGIN_RATELIMIT_DISABLED: "1"

      - name: Upload Playwright report
        # ⚠️ `always()`, KHÔNG `failure()` [21/09/2026]. Một job bị GIẾT vì chạm
        # `timeout-minutes` kết thúc với trạng thái **cancelled**, mà `failure()` KHÔNG
        # đúng với cancelled ⇒ bước này bị bỏ qua ⇒ **không artifact nào được để lại**.
        # Hệ quả đo được: bốn job cần trình duyệt treo suốt từ 21/09 và bước điều tra số
        # một ("đọc report của Playwright") không thực hiện được — không có gì để đọc.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-a0:
    name: E2E Phase A0 (Playwright + Postgres local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # assertTestDb chấp nhận host localhost + db ci_test (không phải Supabase prod).
      # ⚠️ KHÔNG dùng ${{ env.CI_DATABASE_URL }} ở job-level env: GitHub Actions không
      # cho phép tham chiếu context `env` bên trong chính khối env của workflow/job
      # (chỉ step-level mới được). Phải ghi literal — trùng giá trị env top-level dòng 17.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      # A0 webServer chạy cổng 3100 (xem playwright.a0.config.ts).
      NEXTAUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      # ── CỔNG CHẶN BRUTE-FORCE ĐĂNG NHẬP, TẮT TRONG MÔI TRƯỜNG TEST [21/09/2026] ──
      #
      # `lib/auth.ts:132` chặn 10 lượt/phút theo IP và **5 lượt/phút theo ĐỊNH DANH**;
      # bộ đếm nằm trong BỘ NHỚ TIẾN TRÌNH server nên `resetDb()` không xoá được. Bộ
      # E2E qua trình duyệt đăng nhập lại nhiều lần bằng vài tài khoản ⇒ vượt trần ⇒
      # `authorize()` trả `null`, trang Ở LẠI `/login` **không ném lỗi nào**, và mỗi ca
      # hết 30 giây mới chịu thua. Với hàng chục ca × retry, job chạm `timeout-minutes`
      # và bị GIẾT. Đó là lý do bốn job cần trình duyệt treo suốt từ 21/09.
      #
      # ⚠️ Đây KHÔNG phải nâng trần thời gian — nguyên nhân đã đo được, và đây là cửa
      # thoát mà chính `lib/auth.ts:128` khai ra cho đúng tình huống này. Prod KHÔNG đổi
      # một dòng nào.
      #
      # ⚠️ Vế IP đã được chữa ĐÚNG CÁCH ở `tests/e2e/_helpers/auth.ts` (mỗi lượt đăng
      # nhập một IP riêng — cùng tiền lệ `forgot-password.spec.ts`). Thứ CÒN LẠI buộc
      # phải tắt là vế ĐỊNH DANH: nó chỉ chữa được bằng cách cho mỗi ca một email, mà
      # làm vậy cho ~20 spec đang có là một đợt riêng.
      #
      # ⚠️ Mẫu KHÔNG cần cửa thoát này đã có: `tests/e2e/a0/thu-tien-theo-con.spec.ts`
      # cho mỗi ca một email và chạy 3 lượt liên tiếp 5/5 xanh **với cổng chặn BẬT**.
      # Spec mới nên theo mẫu đó; ngày nào ~20 spec cũ theo hết thì gỡ dòng dưới đây.
      LOGIN_RATELIMIT_DISABLED: "1"
      BASE_URL: "http://localhost:3100"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema (local CI Postgres)
        run: pnpm exec prisma migrate deploy

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install lần $lan treo hoặc lỗi — thử lại"
            sleep 10
          done
          echo "::error::playwright install hỏng cả 3 lần — thường là mirror apt của runner, chạy lại job"
          exit 1

      - name: Build app
        run: pnpm build

      - name: Run Phase A0 e2e
        # playwright.a0.config.ts: .env.test vắng ở CI → giữ env CI ở trên (localhost).
        # ── NỢ-16: CHỤP CÂY TIẾN TRÌNH ĐÚNG LÚC ĐANG TREO ──────────────────────
        # Bốn job dựng `webServer` treo SAU khi chạy xong ca cuối rồi bị `timeout-minutes`
        # (20 phút) giết — và runner giết sạch luôn mọi chứng cứ. Reporter `line` cho
        # biết ca cuối là ca nào, nhưng KHÔNG nói được vì sao tiến trình không thoát.
        #
        # Chó canh dưới đây in cây tiến trình ở phút 12 — lúc đó đã biết chắc là treo,
        # mà job còn sống nên log vẫn ra được. Nó CHỈ ĐỌC: không gửi tín hiệu nào cho bộ
        # test, nên không làm sai lệch chính thứ đang đo.
        #
        # Dấu vết đã có: runner phải "Terminate orphan process: (sh)" và
        # "(next-server (v16.2.6))" ở bước dọn dẹp ⇒ chuỗi
        # `pnpm start` → sh → next start → next-server để lọt tiến trình cháu.
        # Cây tiến trình sẽ cho thấy CHÍNH XÁC cái nào còn sống và cha nó là ai.
        #
        # `DEBUG=pw:webserver` để Playwright tự kể nó gửi tín hiệu gì, lúc nào.
        # ⛔ KHÔNG nâng `timeout-minutes` — trần không phải chỗ hỏng.
        run: |
          (
            # NGỦ THÀNH TỪNG GIÂY, không `sleep 12m` một phát. `trap` chỉ giết được
            # SUBSHELL, còn `sleep` là CON của nó nên sống sót và GIỮ STDOUT đã thừa kế
            # => runner ngồi chờ hết ngần ấy phút dù bộ test xong từ lâu. Đo thật: bản
            # `sleep 5` làm một lệnh 1 giây mất 5 giây. Ngủ từng giây thì mất mát tối đa
            # là MỘT giây.
            for _ in $(seq 1 720); do sleep 1; done
            echo "::warning title=NỢ-16::Đã 12 phút — bộ test chưa thoát. Chụp cây tiến trình."
            echo "──────── ps -ef --forest ────────"
            ps -ef --forest 2>/dev/null | tail -60 || ps -ef | tail -60
            echo "──────── cổng đang nghe ────────"
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -20
            echo "────────────────────────────────"
          ) &
          CHO_CANH=$!
          # BẮT BUỘC dùng `trap`, không phải một dòng `kill` ở cuối: GitHub chạy khối này
          # bằng `bash -e`, nên lệnh test ĐỎ là kịch bản thoát NGAY và dòng `kill` phía dưới
          # không bao giờ chạy. Khi đó `sleep` còn sống sẽ GIỮ STDOUT MỞ và runner ngồi chờ
          # hết 12/16 phút — biến một job 5 phút thành job chạm trần. Tức cái đèn tự gây ra
          # đúng thứ nó sinh ra để soi.
          trap 'kill "$CHO_CANH" 2>/dev/null || true' EXIT
          pnpm test:e2e:a0
          MA=$?
          kill "$CHO_CANH" 2>/dev/null || true
          exit $MA
        env:
          DEBUG: pw:webserver

      - name: Upload A0 Playwright report
        # ⚠️ `always()`, KHÔNG `failure()` [21/09/2026]. Một job bị GIẾT vì chạm
        # `timeout-minutes` kết thúc với trạng thái **cancelled**, mà `failure()` KHÔNG
        # đúng với cancelled ⇒ bước này bị bỏ qua ⇒ **không artifact nào được để lại**.
        # Hệ quả đo được: bốn job cần trình duyệt treo suốt từ 21/09 và bước điều tra số
        # một ("đọc report của Playwright") không thực hiện được — không có gì để đọc.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a0
          path: playwright-report/
          retention-days: 7

  e2e-r7:
    name: E2E Phase R7 ${{ matrix.shard }}/2 (Playwright service-level + Postgres local)
    runs-on: ubuntu-latest
    # 03/09/2026 — CẮT LÀM HAI SHARD thay vì nới trần lần thứ ba.
    #
    # Lượt chạy 100568411670: **277 xanh / 0 đỏ**, rồi bị cắt ở đúng 28,0 phút —
    # "1 interrupted, 83 did not run". Đây là lần thứ hai bộ này chạm trần, và chú
    # thích trong `playwright.r7.config.ts` đã dặn sẵn: chạm nữa thì cắt bộ, ĐỪNG
    # nới tiếp, vì nới mãi là mất luôn tín hiệu "bộ test đang chậm dần".
    #
    # Chia được vì mỗi job trong ma trận có container Postgres RIÊNG — hai shard
    # không dùng chung `ci_test` nên `resetDb()` của shard này không xoá dữ liệu
    # của shard kia. `workers: 1` giữ nguyên trong từng shard vì các spec vẫn dùng
    # chung một DB bên trong shard đó.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # 344 test tuần tự (workers=1) — suờn lớn nhất trong các job e2e. Đo được: cùng 344
    # test, cùng 0 lỗi, bước chạy dao động 4,5 phút → 12,5 phút chỉ vì tốc độ runner
    # (job 96766997067 vs 96715795093). Thêm retries=2: 2 test đỏ đẩy 4,5 → 9,2 phút.
    # Trần 20 không đủ cho ca xấu, và khi chạm trần job bị giết CÂM — trông y hệt một
    # cú treo, đã tốn một vòng điều tra để nhận ra không phải. teacher/elearning vốn đã được 25.
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # assertTestDb chấp nhận host localhost + db ci_test (không phải Supabase prod).
      # KHÔNG dùng ${{ env.* }} ở job-level env (GitHub Actions cấm) — ghi literal.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      NEXTAUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      BASE_URL: "http://localhost:3100"
      # Mọi spec R7 test service/action trực tiếp (DB) → bỏ webServer ⇒ không cần
      # `pnpm build`/`pnpm start`. 4 spec cần browser hiện đang fixme/skip.
      R7_SKIP_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # ĐÃ XẢY RA ĐÚNG CÁI CẢNH BÁO CŨ (22/08): bản trước của khối này ghi "KHÔNG cài trình
      # duyệt — không spec nào dùng fixture page/browser", kèm dòng dặn "thêm spec có browser thì
      # phải cài lại". Rồi `class-roster-actions.spec.ts` được thêm vào, CÓ dùng `page` và
      # `setViewportSize`, mà không ai cài — job đỏ với
      # `browserType.launch: Executable doesn't exist`.
      #
      # Nó đỏ KHÔNG ĐỀU (xanh trên `test`, đỏ trên PR cùng base) vì còn tùy ảnh runner có sẵn
      # bản Playwright khớp hay không — đúng loại đỏ bị đổ cho "flaky" rồi bỏ qua.
      #
      # Cài CHỈ binary chromium, KÈM `--with-deps` thì KHÔNG: `--with-deps` chạy apt, và apt treo
      # 19 phút là đúng thứ đã giết job này một lần (xem chú thích ở job smoke). Binary không cần
      # apt vì ảnh ubuntu-latest đã có sẵn thư viện hệ thống.
      - name: Cài chromium (chỉ binary, KHÔNG --with-deps)
        run: pnpm exec playwright install chromium

      - name: Run Phase R7 e2e
        # playwright.r7.config.ts: globalSetup (tái dùng a0) chạy prisma migrate deploy
        # lên Postgres local; .env.test vắng ở CI → giữ env CI ở trên (localhost ci_test).
        # Gọi THẲNG playwright, không qua `pnpm test:e2e:r7 -- --shard=…`: đường
        # `--` của pnpm nuốt mất cờ, playwright đọc "--shard=1/2" thành BIỂU THỨC
        # LỌC TÊN FILE và báo "No tests found" — job xanh giả vì chạy 0 test.
        # (Đã thử tay ở local trước khi chốt: gọi thẳng ra 184 + 179 = 363 test,
        # khớp đúng tổng 363 của lượt chạy bị cắt.)
        run: pnpm exec playwright test -c playwright.r7.config.ts --shard=${{ matrix.shard }}/2

      - name: Upload R7 Playwright report
        # `always()` chứ không `failure()`: job bị GitHub giết vì hết trần mang trạng thái
        # "cancelled", không phải "failure" ⇒ bước này bị bỏ qua và KHÔNG còn một dấu vết
        # nào để truy. Đó là lý do lần trước phải đoán từ log trống.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Tên phải kèm shard: hai job cùng tên artifact là lỗi cứng ở
          # upload-artifact@v4 (không còn gộp như v3).
          name: playwright-report-r7-shard${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

