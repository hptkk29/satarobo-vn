  e2e-teacher:
    name: "E2E site GV #06 (browser + prebuilt server, flag ON)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      NEXTAUTH_URL: "http://localhost:3131"
      NEXT_PUBLIC_APP_URL: "http://localhost:3131"
      BASE_URL: "http://localhost:3131"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema
        # Trước build: ISR public pages query DB lúc build (xem comment đầu file).
        run: pnpm exec prisma migrate deploy

      - name: Build app
        # Browser spec cần server THẬT: playwright.teacher.config.ts ở CI chạy
        # `pnpm start -p 3131` (prebuilt) + tự bơm TEACHER_SITE_ENABLED=true cho
        # webServer (teacher layout gate flag — OFF thì /teacher/* không render).
        run: pnpm build

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install lần $lan treo hoặc lỗi — thử lại"
            sleep 10
          done
          echo "::error::playwright install hỏng cả 3 lần — thường là mirror apt của runner, chạy lại job"
          exit 1

      - name: Run teacher-site browser e2e
        run: pnpm test:e2e:teacher

      - name: Upload teacher Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-teacher
          path: playwright-report/
          retention-days: 7

