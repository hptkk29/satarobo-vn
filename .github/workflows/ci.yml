name: CI

on:
  push:
    # `test` = nhánh tiền-prod (chốt 01/08/2026), Vercel environment `test` bám
    # nhánh này. CI phải chạy ở đây, không thì cổng nghiệm thu chỉ có UAT tay.
    # (`develop` là tàn dư, giữ để không phá nhánh cũ nếu ai đó còn dùng.)
    branches: [main, test, develop]
  pull_request:
    branches: [main, test, develop]

# Cancel in-progress runs when new commits land on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build cần Prisma client + DB connection. Postgres service container chạy
  # ở mọi job dùng `pnpm build` (quality + e2e). Migrate deploy trước build.
  CI_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test

jobs:
  quality:
    name: Quality (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Boundaries (dependency-cruiser)
        # Architecture governance (Doc 15 §4.10). Hiện chỉ chặn rule severity 'error'
        # (circular / unresolvable / not-to-test / deep cross-module import).
        # Rule app→lib/db đang 'warn' (không fail) tới khi A0-04 (scopedDb) hoàn tất → đổi 'error'.
        run: pnpm lint:boundaries

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      # Canary secret trong bundle client — variables.md liệt đây là cổng BẮT BUỘC trước
      # go-live nhưng tới 09/08/2026 chưa có bước nào thực thi. Lý lẽ đầy đủ + vì sao KHÔNG
      # dùng `grep service_role` nằm ngay đầu file script (grep vừa kêu oan trên bản build
      # sạch vì chuỗi trong @supabase/supabase-js, vừa bỏ lọt khoá đời cũ vì nó là JWT).
      - name: Canary — không secret nào lọt bundle client
        run: node scripts/canary-client-bundle-keys.mjs

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test:unit -- --run --reporter=verbose

  chat-db-tests:
    name: Chat DB invariants (Vitest + Postgres local)
    # Job `unit-tests` KHÔNG có Postgres ⇒ mọi spec `tests/chat` (describe.skipIf) skip
    # sạch ở đó. Job này là nơi DUY NHẤT tầng DB của module chat thật sự chạy trong CI:
    # thiếu nó, đột biến kiểu `leavers = existing.filter(() => false)` (PH bị gỡ khỏi lớp
    # vẫn đọc được nhóm) vẫn cho CI XANH.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # HAS_LOCAL_DB của tests/chat/*.spec.ts nhận host localhost + db ci_test.
      # KHÔNG dùng ${{ env.* }} ở job-level env (GitHub Actions cấm) — ghi literal.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema (local CI Postgres)
        run: pnpm exec prisma migrate deploy

      # RBAC v2 lấy quyền từ DỮ LIỆU (RoleDef + RolePermission), không từ code. Không seed
      # thì `parent-permission.spec.ts` không có RoleDef PARENT để đọc — mà đó đúng là bài
      # test canh sự cố 10/08 (114 phụ huynh / 0 UserOrgRole ⇒ không gửi được tin nào).
      - name: Seed RoleDef + RolePermission (dữ liệu quyền v2)
        run: pnpm exec tsx prisma/seed-roles.ts

      - name: Run chat DB tests
        # = `pnpm test:chat-db` chạy tay được y hệt (vitest run tests/chat).
        run: pnpm test:chat-db

      # P2 · US-08 — TS-08 (quyền theo Position) cũng cần Postgres thật. Dùng chung job
      # này thay vì dựng job mới: cùng service, cùng seed RoleDef, chạy thêm ~10 giây.
      - name: Run nền-hệ-thống DB tests
        run: pnpm test:nen-db

      # Nhận lead từ nguồn ngoài (form Sale / quatang) — cùng lý do như 2 bước trên:
      # `tests/lead-intake` có `describe.skipIf(!RUN)` nên ở job `unit-tests` (không có
      # Postgres) nó SKIP SẠCH. Thiếu bước này thì xoá trắng luật QĐ-D1 ("trùng SĐT
      # khác con ⇒ gắn thêm LeadChild") vẫn cho CI xanh — đúng thứ job này sinh ra để
      # chặn.
      - name: Run lead-intake DB tests
        run: pnpm test:lead-intake

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # PR + main + `test`. Trước 11/08 job này skip trên `test`, mà `test` là nhánh
    # TIỀN-PROD (chốt 01/08) — hệ quả: spec smoke mục nát dần suốt các đợt chat mà
    # không ai thấy, rồi nổ ở PR đầu tiên nhắm vào `test` (PR #106: 4 test đỏ vì màn
    # admin bỏ tiêu đề "Tin nhắn" và portal thêm cổng chính sách US-16).
    # Chỉ `develop` còn được bỏ qua để tiết kiệm CI.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      - name: Seed DB (cho E2E có data thật)
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install lần $lan treo hoặc lỗi — thử lại"
            sleep 10
          done
          echo "::error::playwright install hỏng cả 3 lần — thường là mirror apt của runner, chạy lại job"
          exit 1

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Run Playwright smoke tests
        run: pnpm test:e2e
        env:
          BASE_URL: "http://localhost:3000"
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DIRECT_URL: ${{ env.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-a0:
    name: E2E Phase A0 (Playwright + Postgres local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # assertTestDb chấp nhận host localhost + db ci_test (không phải Supabase prod).
      # ⚠️ KHÔNG dùng ${{ env.CI_DATABASE_URL }} ở job-level env: GitHub Actions không
      # cho phép tham chiếu context `env` bên trong chính khối env của workflow/job
      # (chỉ step-level mới được). Phải ghi literal — trùng giá trị env top-level dòng 17.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      # A0 webServer chạy cổng 3100 (xem playwright.a0.config.ts).
      NEXTAUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      BASE_URL: "http://localhost:3100"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Migrate DB schema (local CI Postgres)
        run: pnpm exec prisma migrate deploy

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install lần $lan treo hoặc lỗi — thử lại"
            sleep 10
          done
          echo "::error::playwright install hỏng cả 3 lần — thường là mirror apt của runner, chạy lại job"
          exit 1

      - name: Build app
        run: pnpm build

      - name: Run Phase A0 e2e
        # playwright.a0.config.ts: .env.test vắng ở CI → giữ env CI ở trên (localhost).
        run: pnpm test:e2e:a0

      - name: Upload A0 Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a0
          path: playwright-report/
          retention-days: 7

  e2e-r7:
    name: E2E Phase R7 (Playwright service-level + Postgres local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # assertTestDb chấp nhận host localhost + db ci_test (không phải Supabase prod).
      # KHÔNG dùng ${{ env.* }} ở job-level env (GitHub Actions cấm) — ghi literal.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      NEXTAUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      BASE_URL: "http://localhost:3100"
      # Mọi spec R7 test service/action trực tiếp (DB) → bỏ webServer ⇒ không cần
      # `pnpm build`/`pnpm start`. 4 spec cần browser hiện đang fixme/skip.
      R7_SKIP_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # KHÔNG cài trình duyệt: toàn bộ 47 spec của tests/e2e/r7 là service-level — gọi thẳng
      # hàm trong lib/, không spec nào dùng fixture `page`/`browser`. Bước cài trước đây chỉ tổ
      # kéo dài job và là chỗ duy nhất khiến nó chết (apt treo 19 phút, xem chú thích ở job smoke).
      # ⚠️ Thêm spec CÓ dùng browser vào tests/e2e/r7 thì phải cài lại trình duyệt ở đây.

      - name: Run Phase R7 e2e
        # playwright.r7.config.ts: globalSetup (tái dùng a0) chạy prisma migrate deploy
        # lên Postgres local; .env.test vắng ở CI → giữ env CI ở trên (localhost ci_test).
        run: pnpm test:e2e:r7

      - name: Upload R7 Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-r7
          path: playwright-report/
          retention-days: 7

  e2e-fl:
    name: E2E Phase FL (Playwright service-level + Postgres local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      NEXTAUTH_SECRET: "ci-build-only-secret-do-not-use-in-prod-32chars"
      NEXTAUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      BASE_URL: "http://localhost:3100"
      # Spec FL test service/action trực tiếp (DB) → bỏ webServer ⇒ không cần build/start.
      # 3 spec UI (lesson-scorm T06, question-bank T03/T04) + teacher-materials hiện fixme/skip.
      FL_SKIP_WEBSERVER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Cache binary trình duyệt — lần chạy sau khỏi tải lại ~130MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` gọi apt-get, mà mirror Ubuntu của runner CÓ LÚC TREO HẲN. Đo 19/08/2026:
      # apt đứng im 19 phút không một dòng log, job hết trần 20 phút và bị huỷ TRƯỚC KHI chạy nổi
      # một dòng test nào — 3/5 job E2E chết cùng kiểu đó, hai lần liên tiếp, trong khi 2 job còn
      # lại dùng ĐÚNG lệnh này thì qua. Không phải cấu hình sai, là mạng của runner.
      # `timeout` cắt sau 6 phút rồi thử lại, thay vì để cả ngân sách job trôi vào một bước cài đặt.
      - name: Install Playwright browsers
        run: |
          for lan in 1 2 3; do
            # Dọn apt-get MỒ CÔI của lần trước. `timeout` chỉ giết tiến trình CHA
            # (`playwright install`); `apt-get` con VẪN CHẠY và giữ /var/lib/apt/lists/lock
            # ⇒ lần thử sau chết ngay với "Could not get lock", cả 3 lần đều vô ích.
            # Đã đo thật: job site GV, run 32236393980 — lần 2 và 3 chết trong 17 giây.
            if [ "$lan" -gt 1 ]; then
              sudo pkill -9 -x apt-get 2>/dev/null || true
              sudo pkill -9 -x dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            timeout 300 pnpm exec playwright install --with-deps chromium && exit 0
