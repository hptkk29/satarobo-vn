name: Shadow-compare công nợ PROD (read-only)

# =============================================================================
# So công nợ SỔ MỚI (PaymentRequest ← PaymentAllocation) với công nợ ĐANG HIỂN THỊ
# (Payment RECORDED) trên Supabase PROD — CHỈ ĐỌC.
#
# VÌ SAO CẦN WORKFLOW NÀY (13/09/2026): `pnpm payments:shadow-compare` chạy được ở
# máy dev, nhưng `.env` ở máy dev trỏ DB DEV — con số nó in ra KHÔNG nói gì về prod.
# Trước file này, prod chưa từng được đo: không workflow nào chạy script tiền
# (`grep -rln "shadow-compare\|payments:backfill" .github/workflows/` chỉ ra 2 file
# về shadow RBAC, khác việc). Nên mọi kết luận "prod lệch bao nhiêu" đều là phỏng đoán.
#
# Đây là số mà chủ dự án dùng để quyết bao giờ cutover sổ thu (cờ PAYMENT_LEDGER_V2).
# ⚠️ Đo 13/09/2026: cờ đó hiện có **0 đường gọi** trong mã chạy thật
# (`lib/flags.ts:168` là định nghĩa duy nhất, ngoài test) và **không tồn tại** trong
# 40 biến env Production. Bật nó lúc này KHÔNG đổi hành vi gì. Bảng này vì vậy là
# thước đo "còn bao xa tới cutover", chưa phải cổng bật/tắt.
#
# Chạy tay: Actions → "Shadow-compare công nợ PROD (read-only)" → Run workflow.
# Kết quả nằm ở Summary của run + log step "Shadow-compare".
#
# AN TOÀN:
#  · Script tự khai "CHỈ ĐỌC — không ghi một dòng nào" (scripts/shadow-compare-debt.ts:9).
#    Nó chỉ có findMany/aggregate; không import hàm ghi nào.
#  · Job in "DB host" ngay dòng đầu (`currentDbHost()` đã cắt phần user:password) —
#    đọc log là biết chắc đã chạy đúng DB, không phải đoán.
#  · KHÔNG có `--commit`/`--apply`: script này không có cờ ghi nào để gõ nhầm.
#  · Cột in ra: mã đơn · cơ sở · số tiền. KHÔNG có tên/SĐT phụ huynh ⇒ Summary của
#    run không chứa PII.
#  · CỐ Ý KHÔNG có `schedule:` — đây là thước đo chạy khi cần, không phải cron. Thêm
#    cron nghĩa là mỗi ngày một lượt quét toàn bảng Order trên prod; nhớ bài học
#    egress 05/09 (memory "Supabase prod vượt egress vì bão sla-check").
#
# SECRETS (dùng chung deploy.yml / shadow-report.yml): PROD_DATABASE_URL, PROD_DIRECT_URL.
# Dùng PROD_DIRECT_URL (session pooler :5432) cho cả 2 biến — tránh quirk
# prepared-statement của transaction pooler, giống seed-prod-roles.yml + shadow-report.yml.
#
# ⚠️ `workflow_dispatch` chỉ hiện trong tab Actions khi file này đã nằm trên NHÁNH
# MẶC ĐỊNH (main). Còn ở nhánh tính năng thì chưa bấm được.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số dòng đơn lệch in ra (tổng kết luôn in đủ)"
        required: false
        default: "60"
      all:
        description: "In cả đơn KHỚP (mặc định chỉ in đơn lệch)"
        type: boolean
        required: false
        default: false

concurrency:
  group: shadow-compare-cong-no
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Shadow-compare công nợ (Supabase prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kiểm tra secrets prod (fail sớm)
        run: |
          missing=0
          [ -n "${{ secrets.PROD_DATABASE_URL }}" ] || { echo "::error::Thiếu secret PROD_DATABASE_URL"; missing=1; }
          [ -n "${{ secrets.PROD_DIRECT_URL }}" ]   || { echo "::error::Thiếu secret PROD_DIRECT_URL"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Shadow-compare
        # Ghi ra file rồi mới phát đi 2 đường, để `set -o pipefail` không bị `tee`
        # nuốt exit code: script chết thì job phải ĐỎ, không được xanh với Summary rỗng.
        # Output là văn bản canh cột nên Summary phải bọc trong khối ``` , không thì
        # Markdown gộp khoảng trắng và bảng vỡ hết.
        run: |
          set -euo pipefail
          # Ghi ra RUNNER_TEMP, KHÔNG ghi vào workspace: workspace là bản checkout của
          # repo, để file lạ ở đó là mở đường cho một bước sau `git add` phải nó.
          out="$RUNNER_TEMP/shadow-compare-cong-no.txt"
          pnpm exec tsx scripts/shadow-compare-debt.ts \
            --limit "${{ inputs.limit || '60' }}" \
            ${{ inputs.all == true && '--all' || '' }} \
            > "$out"
          cat "$out"
          {
            echo '## Shadow-compare công nợ — Supabase PROD'
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
